spring.application.name=ClinicManagementSystem

#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/clinic_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss


# JWT
jwt.secret=your_jwt_secret_key
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# VNPay (sandbox) —
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnpay.return-url=http://localhost:5173/payment/result
vnpay.payment-expire-minutes=15
vnpay.refund-ip=127.0.0.1
payment.no-show-refund-percent=70

# Chu kỳ quét huỷ giao dịch thanh toán quá hạn (ms)
payment.expiry-check-interval-ms=3600000

